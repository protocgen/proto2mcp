syntax = "proto3";

package protocgen.mcp.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/protocgen/proto2mcp/gen/protocgen/mcp/v1;mcpv1";

extend google.protobuf.MethodOptions {
  MethodMCPOptions method = 1052025;
}

extend google.protobuf.ServiceOptions {
  ServiceMCPOptions service = 1052026;
}

extend google.protobuf.FileOptions {
  FileMCPOptions file = 1052027;
}

enum FailureStrategy {
  FAIL_FAST = 0;
  PARTIAL_RESULT = 1;
  ROLLBACK = 2;
}

message MacroStep {
  string tool = 1;
  bool parallel = 2;
  string output_key = 3;
  map<string, string> input_mapping = 4;
}

message MacroDefinition {
  repeated MacroStep steps = 1;
  FailureStrategy on_failure = 2;
}

message MethodMCPOptions {
  string tool_name = 1; // override tool name
  string description = 2; // LLM-facing description, overrides proto comment
  bool skip = 3; // don't generate for this method
  bool resource = 4; // V2: expose as MCP Resource
  string resource_uri_template = 5; // V2: e.g. "patient://{patient_id}"
  bool read_only = 6; // V2: hint for LLM
  bool destructive = 7; // V2: hint for LLM
  int32 version = 8; // V2: tool version number
  bool is_deprecated = 9; // V2: explicit deprecation, also reads proto deprecated
  MacroDefinition macro = 15;
}

message PromptTemplate {
  string name = 1;
  string description = 2;
  repeated string tools = 3; // tool names this prompt uses
}

message ServiceMCPOptions {
  string tool_name_prefix = 1;
  string description = 2;
  repeated PromptTemplate prompts = 10; // V3: MCP Prompts
}

message FileMCPOptions {
  bool skip = 1; // skip entire file
}
