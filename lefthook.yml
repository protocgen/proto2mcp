# Local-only hooks — no private remotes (OSS repo).

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: "! gofmt -l {staged_files} | grep ."

    go-vet:
      glob: "*.go"
      run: |
        go vet ./...
        cd codegen && go vet ./...

    golangci-lint:
      glob: "*.go"
      fail_text: "golangci-lint failed (non-blocking, CI is authoritative)"
      run: |
        golangci-lint run ./... 2>/dev/null
        cd codegen && golangci-lint run ./... 2>/dev/null
        true

    editorconfig:
      run: editorconfig-checker

    yaml-lint:
      glob: "*.{yaml,yml}"
      run: yamllint {staged_files}

pre-push:
  commands:
    tests:
      run: make test
