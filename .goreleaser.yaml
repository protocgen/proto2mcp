version: 2

project_name: protoc-gen-proto2mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: protoc-gen-proto2mcp
    dir: codegen
    main: ./cmd/protoc-gen-proto2mcp
    binary: protoc-gen-proto2mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

dockers:
  - image_templates:
      - "ghcr.io/protocgen/proto2mcp:{{ .Tag }}"
      - "ghcr.io/protocgen/proto2mcp:latest"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
