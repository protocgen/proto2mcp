version: 2

before:
  hooks:
    - go mod tidy
    - cd codegen && go mod tidy

builds:
  - id: protoc-gen-proto2mcp
    dir: codegen
    main: ./cmd/protoc-gen-proto2mcp
    binary: protoc-gen-proto2mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

sboms:
  - artifacts: archive
